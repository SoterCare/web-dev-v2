  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i)+yOff,z=p.getZ(i)+zOff,base=R(y)+rOff,a=ac+x/base,r=base+z;p.setXYZ(i,Math.sin(a)*r,y,Math.cos(a)*r);}
  return geo;
}
function honeycomb(){
  const Rref=4.75,Nc=52,w=2*Math.PI*Rref/Nc,s=w/Math.sqrt(3),inr=w/2,rowP=1.5*s,rows=24,h=0.055,sh=0.68,K=6,NP=18;
  const y0=-(rows-1)*rowP/2,pos=[],uv=[],col=[],idx=[],rn=rand(29);let base=0;
  const rHex=t=>{let d=((t%(Math.PI/3))+Math.PI/3)%(Math.PI/3);if(d>Math.PI/6)d-=Math.PI/3;return inr/Math.cos(d);};
  const podSD=(x,y)=>insideRR(x,y-PY,PA+0.18,PB+0.18,PR+0.18);
  for(let r=0;r<rows;r++)for(let c=0;c<Nc;c++){
    const cx=(c+(r%2?0.5:0))*w-Math.PI*Rref,cy=y0+r*rowP,tint=0.95+rn()*0.08;
    if(Math.abs(wrapA(cx/Rref-Math.PI))<GAP+0.075)continue;
    for(let k=0;k<=K;k++){
      const ph=k/K*Math.PI,sp=Math.sin(ph),cp=Math.cos(ph),zc=h*Math.sign(cp)*Math.pow(Math.abs(cp),0.45);
      for(let v=0;v<=NP;v++){
        const an=v/NP*Math.PI*2,rh=rHex(an),rr=(rh+(inr-rh)*0.38*sp)*(1-(1-sh)*sp);
        const x=cx+rr*Math.cos(an),y=cy+rr*Math.sin(an);
        const wz=0.035*Math.sin(x*0.9+Math.sin(y*0.7)*1.5)*Math.sin(y*1.6+x*0.25);
        pos.push(x,y,zc+wz);uv.push(v/NP*3,k/K*0.5);
        let ao=(1-0.28*sp*sp)*(cp<0?0.84:1);
        const dy=5.35-Math.abs(y);ao*=1-0.45*Math.exp(-Math.max(dy,0)/0.3);
        const dg=(Math.abs(wrapA(x/Rref-Math.PI))-(GAP+0.19))*Rref;ao*=1-0.4*Math.exp(-Math.max(dg,0)/0.22);
        if(cp>=-0.05){const sd=podSD(x,y);ao*=1-0.5*Math.exp(-Math.max(sd,0)/0.22);}

      }
    }

  }

  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));

  g.setIndex(idx);

  const t=knitTexture();

function heatherCanvas(w,h,seed,lo,hi){
  const c=canvas(w,h),g=c.getContext('2d'),id=g.createImageData(w,h),rn=rand(seed);
  for(let y=0;y<h;y++){const row=(rn()-0.5)*8;for(let x=0;x<w;x++){const v=Math.round(lo+(hi-lo)*rn()*0.6+(hi-lo)*0.2+row),i=(y*w+x)*4;id.data[i]=id.data[i+1]=id.data[i+2]=Math.max(0,Math.min(255,v));id.data[i+3]=255;}}
  g.putImageData(id,0,0);return c;
}
function mottle(c,seed,n,amp){
  const g=c.getContext('2d'),rn=rand(seed),w=c.width,h=c.height;
  g.save();g.filter='blur('+Math.round(Math.min(w,h)*0.04)+'px)';
  for(let i=0;i<n;i++){const x=rn()*w,y=rn()*h,rx=(0.03+rn()*0.08)*w,ry=(0.05+rn()*0.2)*h,v=rn()<0.5?0:255;
    g.globalAlpha=amp*(0.4+rn()*0.6);g.fillStyle=gray(v);
    [-w,0,w].forEach(o=>{g.beginPath();g.ellipse(x+o,y,rx,ry,rn()*3,0,Math.PI*2);g.fill();});}
  g.restore();
}
function bands(group){
  const Hb=1.1,t=0.24,nIn=8,nArc=14,nOut=8;

  mottle(c,5,70,0.03);
  const tot=nIn+nArc+nOut-1,vStitch=(0.25/(Hb-t))*(nIn-1)/tot;
  [vStitch,1-vStitch].forEach(v=>{const y=(1-v)*256;for(let x=0;x<1024;x+=32){g.fillStyle=gray(74);g.fillRect(x+4,y-2.5,22,5);g.fillStyle=gray(160);g.fillRect(x+5,y-2.5,20,1.2);}});
  const map=tex(c,true);map.wrapS=map.wrapT=THREE.RepeatWrapping;map.repeat.set(3,1);
  const mat=fabricMat({color:0xaeaaa6,map,bumpMap:map,bumpScale:0.45});
  const g0=GAP+0.06;

    for(let i=0;i<nIn;i++){const y=yE-sg*(Hb-(Hb-t)*i/(nIn-1));pts.push(new THREE.Vector2(R(y)-t*0.95,y));}
    const yc=yE-sg*t;
    for(let j=1;j<nArc;j++){const a=Math.PI-j/(nArc-1)*Math.PI;pts.push(new THREE.Vector2(R(yc)+Math.cos(a)*t*0.95,yc+sg*Math.sin(a)*t));}
    for(let i=1;i<nOut;i++){const y=yE-sg*(t+(Hb-t)*i/(nOut-1));pts.push(new THREE.Vector2(R(y)+t*(0.95+0.08*Math.sin(Math.PI*i/(nOut-1))),y));}
    const m=new THREE.Mesh(thigh(new THREE.LatheGeometry(pts,220,Math.PI+g0,Math.PI*2-2*g0)),mat);m.castShadow=m.receiveShadow=true;group.add(m);
  });
}
function backOpening(group){

  [1,-1].forEach(sd=>{

function liner(group){
  const c=heatherCanvas(256,320,31,196,224);
  const geo=slab(PA+0.75,PB+0.3,1.1,0.04,0.02,{ex:30,ey:40,nf:6});

function podTextures(logo){
  const W=PA*2*P,H=PB*2*P;
  const hc=canvas(W,H),h=hc.getContext('2d'),cc=canvas(W,H),c=cc.getContext('2d'),ec=canvas(W,H),e=ec.getContext('2d');
  h.fillStyle=gray(128);h.fillRect(0,0,W,H);
  c.fillStyle='rgb(112,109,106)';c.fillRect(0,0,W,H);
  e.fillStyle='#000';e.fillRect(0,0,W,H);
  const dot=(ctx,x,y,r,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.arc(X(x),Y(y),r*P,0,Math.PI*2);ctx.fill();};
  for(let row=0;row<5;row++){const y=3.68-row*0.155;for(let x=-2.6;x<=2.6;x+=0.155){const xx=x+(row%2?0.0775:0);if(insideRR(xx,y,PA,PB,PR)<-0.42){dot(h,xx,y,0.048,gray(48));dot(c,xx,y,0.05,'rgb(52,51,50)');}}}
  h.save();h.filter='blur(1.4px)';h.globalCompositeOperation='lighter';h.globalAlpha=0.3;
  const lw=3.6,lh=lw*logo.height/logo.width;h.drawImage(logo,X(-lw/2),Y(2.18+lh/2),lw*P,lh*P);h.restore();
  h.save();h.filter='blur(0.8px)';h.strokeStyle=gray(178);h.lineCap='round';h.lineWidth=0.05*P;
  const px=-1.2,py=0.4,pr=0.17;h.beginPath();h.arc(X(px),Y(py),pr*P,-Math.PI/2+0.75,-Math.PI/2-0.75+Math.PI*2);h.stroke();
  h.beginPath();h.moveTo(X(px),Y(py+0.02));h.lineTo(X(px),Y(py+0.24));h.stroke();h.restore();
  for(let i=0;i<4;i++){const y=BELL.y+(1.5-i)*0.16;dot(h,-0.08,y,0.032,gray(108));dot(c,-0.08,y,0.03,'rgb(214,214,210)');dot(e,-0.08,y,0.034,'#fff');}
  h.save();h.filter='blur(1px)';h.strokeStyle=gray(92);h.lineWidth=0.06*P;
  rrPath(h,X(BELL.x-BELL.a-0.06),Y(BELL.y+BELL.b+0.06),X(BELL.x+BELL.a+0.06),Y(BELL.y-BELL.b-0.06),0.3*P);h.stroke();h.restore();

  h.fillStyle=gray(96);rrPath(h,X(WIN.x0+L),Y(WIN.y1-L),X(WIN.x1-L),Y(WIN.y0+L),0.18*P);h.fill();h.restore();
  c.fillStyle='rgb(118,115,112)';rrPath(c,X(WIN.x0),Y(WIN.y1),X(WIN.x1),Y(WIN.y0),0.3*P);c.fill();
  c.fillStyle='rgb(128,126,123)';rrPath(c,X(WIN.x0+L),Y(WIN.y1-L),X(WIN.x1-L),Y(WIN.y0+L),0.18*P);c.fill();
  c.save();rrPath(c,X(WIN.x0+L+0.1),Y(WIN.y1-L-0.1),X(WIN.x1-L-0.32),Y(WIN.y0+L+0.1),0.1*P);c.clip();
  for(let y=WIN.y0+L+0.18;y<WIN.y1-L-0.1;y+=0.11)for(let x=WIN.x0+L+0.18;x<WIN.x1-L-0.35;x+=0.11){dot(c,x,y,0.028,'rgb(112,110,108)');dot(h,x,y,0.026,gray(88));}

function bellTextures(){
  const Q=300,W=Math.round(BELL.a*2*Q),H=Math.round(BELL.b*2*Q),hc=canvas(W,H),h=hc.getContext('2d');
  h.fillStyle=gray(128);h.fillRect(0,0,W,H);

function flangeTexture(){

function dimension(group,p1,p2,label,color,labelPos,tickDir){
  const mat=new THREE.LineBasicMaterial({color});
  const pts=[p1,p2];
  const t1=tickDir.clone().multiplyScalar(0.45);
  const lines=new THREE.BufferGeometry().setFromPoints([p1,p2,p1.clone().add(t1),p1.clone().sub(t1),p2.clone().add(t1),p2.clone().sub(t1)]);
  group.add(new THREE.LineSegments(lines,mat));
  const dir=p2.clone().sub(p1).normalize(),cm=new THREE.MeshBasicMaterial({color});

}

let model,floater,shadow,shadowMat,bell,bellDir,podMat,dims;
async function build(){
  const logo=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=LOGO_SRC;});
  try{await document.fonts.ready;}catch(e){}

  model=new THREE.Group();model.rotation.y=-0.14;floater.add(model);

  backOpening(model);
  liner(model);
  const fl=new THREE.Mesh(thigh(bend(slab(PA+0.18,PB+0.18,PR+0.18,0.12,0.05,{ex:36,ey:48}),POFF-0.01,0,PY,0)),new THREE.MeshStandardMaterial({map:flangeTexture(),color:0xb2aeaa,roughness:0.96}));

  const tx=podTextures(logo);

  const pod=new THREE.Mesh(thigh(bend(aoSlab(slab(PA,PB,PR,PT,0.2,{ex:48,ey:64,nf:14}),0.28),POFF,0,PY,0)),podMat);
  pod.castShadow=pod.receiveShadow=true;model.add(pod);
  const bn=bellTextures();

  bell.castShadow=bell.receiveShadow=true;model.add(bell);
  bell.geometry.computeBoundingBox();const bc=bell.geometry.boundingBox.getCenter(new THREE.Vector3());bellDir=new THREE.Vector3(bc.x,0,bc.z).normalize();
  const wcx=(WIN.x0+WIN.x1)/2,wcy=(WIN.y0+WIN.y1)/2,wa=(WIN.x1-WIN.x0)/2-WIN.lip,wb=(WIN.y1-WIN.y0)/2-WIN.lip;
  const glass=new THREE.Mesh(thigh(bend(slab(wa,wb,0.18,0.03,0.015,{ex:30,ey:20,nf:6}),POFF,wcx,wcy+PY,PT+0.006)),new THREE.MeshPhysicalMaterial({color:0x3c3b3a,transparent:true,opacity:0.38,roughness:0.12,metalness:0,clearcoat:1,clearcoatRoughness:0.08,envMapIntensity:0.8,depthWrite:false}));

function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const hf=Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.aspect);homeDist=Math.max(49,8.6/Math.tan(hf));
}
function resetView(){controls.target.set(0,-2,0);camera.position.copy(HOME_DIR).multiplyScalar(homeDist).add(controls.target);controls.autoRotate=false;controls.update();}

// let the host page (Lenis) handle wheel scrolling instead of the iframe swallowing it
addEventListener('wheel', e => {
  e.preventDefault();
  parent.postMessage({ sotercareWheel: true, deltaX: e.deltaX, deltaY: e.deltaY, deltaMode: e.deltaMode }, '*');
}, { passive: false });
window.addEventListener('resize',resize);
resize();resetView();

let press=0,down=null;const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||!bell)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>6)return;
  const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);if(ray.intersectObject(bell).length)press=1;
});

const clock=new THREE.Clock();
function loop(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(floater){
    const bob=reduced?0:Math.sin(t*1.2)*0.25;floater.position.y=0.3+bob;
    const k=1-bob*0.35;shadow.scale.set(k,k,1);shadowMat.opacity=1-bob*0.9;
    if(press>0){press=Math.max(0,press-dt*3.2);}
    const depth=Math.sin(press*Math.PI)*0.13;bell.position.copy(bellDir).multiplyScalar(-depth);
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop);
}
build().catch(err=>{document.getElementById('status').textContent='The model could not load. Refresh to try again.';console.error(err);});
loop();
