shGr.addColorStop(0, 'rgba(0,0,0,0.30)'); shGr.addColorStop(0.55, 'rgba(0,0,0,0.10)'); shGr.addColorStop(1, 'rgba(0,0,0,0)');
shG.fillStyle = shGr; shG.fillRect(0, 0, 256, 256);
const shadowMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shCv), transparent: true, depthWrite: false });
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(460, 250), shadowMat);
shadow.rotation.x = -Math.PI / 2; shadow.position.set(0, -14, 20);
scene.add(shadow);

/* ---------- materials ---------- */
const shell = new THREE.MeshStandardMaterial({ name: 'Housing', color: 0xece6da, roughness: 0.6, metalness: 0.02 });
const bezelMat = new THREE.MeshStandardMaterial({ name: 'Bezel', color: 0xe3dccf, roughness: 0.5, metalness: 0.02 });
const gasket = new THREE.MeshStandardMaterial({ name: 'Gasket', color: 0x2b2f35, roughness: 0.7 });
const portMat = new THREE.MeshStandardMaterial({ name: 'Port', color: 0x1c1f24, roughness: 0.6, metalness: 0.3 });
const hubMat = new THREE.MeshStandardMaterial({ name: 'Hub', color: 0xcfc7b8, roughness: 0.4, metalness: 0.05 });
const ledMat = new THREE.MeshStandardMaterial({ name: 'StatusLED', color: 0x8db2cb, emissive: 0x6fa6cc, emissiveIntensity: 1.6 });

const tex = new THREE.TextureLoader().load(SCREEN_IMG, () => document.getElementById('loading')?.remove());
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
// lit display: unlit so the logo keeps its true colours (exports as KHR_materials_unlit)
const screenMat = new THREE.MeshBasicMaterial({ name: 'Screen', map: tex, toneMapped: false });

function mesh(geo, mat, name) {
  const m = new THREE.Mesh(geo, mat);
  m.name = name; m.castShadow = true; m.receiveShadow = true;
  return m;
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

/* ---------- display head (15.6" 16:9 panel) ---------- */
const PANEL_W = 344.2, PANEL_H = 193.6;     // 15.6" active area (mm)
const W = 366, H = 218, D = 46;             // housing (mm)
const TILT_DEG = 30;                        // lean back from vertical
const TILT = THREE.MathUtils.degToRad(-TILT_DEG);
const BB_HEIGHT = 64;                       // bottom-back edge height above desk

// local (y, z) of the head -> world (z, y) of the side profile
const tiltEuler = new THREE.Euler(TILT, 0, 0);
const BB_local = new THREE.Vector3(0, -H / 2, -D / 2).applyEuler(tiltEuler);
const HEAD_Y = BB_HEIGHT - BB_local.y;
function toProfile(y, z) {
  const v = new THREE.Vector3(0, y, z).applyEuler(tiltEuler);
  return new THREE.Vector2(v.z, v.y + HEAD_Y);
}

const device = new THREE.Group(); device.name = 'SoterCare_Edge_Gateway';
const head = new THREE.Group(); head.name = 'DisplayHead';
head.position.set(0, HEAD_Y, 0);
head.rotation.x = TILT;
device.add(head);

head.add(mesh(new RoundedBoxGeometry(W, H, D, 6, 12), shell, 'Housing'));

// slim raised bezel ring
const ring = roundedRect(PANEL_W + 14, PANEL_H + 14, 8);
ring.holes.push(roundedRect(PANEL_W + 4, PANEL_H + 4, 3.5));
const bezelGeo = new THREE.ExtrudeGeometry(ring, { depth: 2.4, bevelEnabled: true, bevelThickness: 0.8, bevelSize: 0.8, bevelSegments: 3, curveSegments: 10 });
const bezel = mesh(bezelGeo, bezelMat, 'Bezel');
bezel.position.z = D / 2 - 0.6;
head.add(bezel);

const gasketMesh = mesh(new THREE.ShapeGeometry(roundedRect(PANEL_W + 4, PANEL_H + 4, 3.5), 8), gasket, 'ScreenBorder');
gasketMesh.position.z = D / 2 + 0.25;
head.add(gasketMesh);

const screen = mesh(new THREE.PlaneGeometry(PANEL_W, PANEL_H), screenMat, 'Screen');
screen.position.z = D / 2 + 0.45;
screen.castShadow = false;
head.add(screen);

// status LED on lower housing lip
const led = mesh(new THREE.CylinderGeometry(1.8, 1.8, 1, 20), ledMat, 'StatusLED');
led.rotation.x = Math.PI / 2;
led.position.set(W / 2 - 22, -H / 2 + 5.5, D / 2 + 0.2);
head.add(led);

// side ports (right side): USB-C x2 and a DC jack
function usbc(y) {
  const g = new THREE.ExtrudeGeometry(roundedRect(9, 3.4, 1.6), { depth: 2, bevelEnabled: false });
  const m = mesh(g, portMat, 'Port_USBC');
  m.rotation.y = Math.PI / 2;
  m.position.set(W / 2 - 1.6, y, 0);
  return m;
}
head.add(usbc(24), usbc(8));
const jack = mesh(new THREE.CylinderGeometry(3.4, 3.4, 2, 28), portMat, 'Port_DC');
jack.rotation.z = Math.PI / 2;
jack.position.set(W / 2 + 0.2, -10, 0);
head.add(jack);

// rear vent slots
for (let i = 0; i < 10; i++) {
  const slot = new THREE.ExtrudeGeometry(roundedRect(150, 4, 2), { depth: 1.4, bevelEnabled: false });
  const s = mesh(slot, portMat, 'Vent');
  s.position.set(0, 58 - i * 12, -D / 2 - 0.9);
  head.add(s);
}

/* ---------- stand (side profile fitted to the head) ---------- */
const K = 1.5;                               // stand feature scale
const BF = toProfile(-H / 2, D / 2);         // bottom-front edge
const BB = toProfile(-H / 2, -D / 2);        // bottom-back edge
const UP = toProfile(H / 2, -D / 2).sub(BB).normalize();  // up the back face
const P  = BB.clone().addScaledVector(UP, H * 0.42);      // rear strut contact
const zN = BF.x + 42 * K;                    // front nose
const P2 = new THREE.Vector2(P.x - 12 * K, P.y + 2 * K);
const R  = new THREE.Vector2(P2.x - 0.45 * (P2.y - 10 * K), 10 * K);
const N1 = new THREE.Vector2(zN - 14 * K, 34 * K);

function lineOffset(a, b, d, ref) {
  const dir = b.clone().sub(a).normalize();
  let n = new THREE.Vector2(-dir.y, dir.x);
  if (ref.clone().sub(a).dot(n) < 0) n.negate();
  return { p: a.clone().addScaledVector(n, d), d: dir };
}
function meet(L1, L2) {
  const cross = L1.d.x * L2.d.y - L1.d.y * L2.d.x;
  const t = ((L2.p.x - L1.p.x) * L2.d.y - (L2.p.y - L1.p.y) * L2.d.x) / cross;
  return L1.p.clone().addScaledVector(L1.d, t);
}

function legProfile() {
  const s = new THREE.Shape();
  s.moveTo(R.x + 2 * K, 0);
  s.lineTo(zN - 17 * K, 0);
  s.quadraticCurveTo(zN, 0, zN, 16 * K);
  s.quadraticCurveTo(zN, 31 * K, N1.x, N1.y);
  s.lineTo(BF.x - 0.5, BF.y + 1);
  s.lineTo(BB.x - 0.5, BB.y - 0.5);
  s.lineTo(P.x, P.y);
  s.quadraticCurveTo(P.x - 6 * K, P.y + 7 * K, P2.x, P2.y);
  s.lineTo(R.x, R.y);
  s.quadraticCurveTo(R.x - 2 * K, 0, R.x + 2 * K, 0);

  const ref = new THREE.Vector2((BB.x + R.x) / 2 + 10, BB.y * 0.45);
  const Lb   = { p: new THREE.Vector2(0, 12 * K), d: new THREE.Vector2(1, 0) };
  const Lf   = lineOffset(N1, BF, 12 * K, ref);
  const Lbot = lineOffset(BB, BF, 8 * K, ref);
  const Lbk  = lineOffset(BB, P, 9 * K, ref);
  const Lr   = lineOffset(P2, R, 13 * K, ref);
  const pts = [meet(Lb, Lf), meet(Lf, Lbot), meet(Lbot, Lbk), meet(Lbk, Lr), meet(Lr, Lb)];
  const hole = new THREE.Path();
  hole.moveTo(pts[0].x, pts[0].y);
  pts.slice(1).forEach(p => hole.lineTo(p.x, p.y));
  hole.lineTo(pts[0].x, pts[0].y);
  s.holes.push(hole);
  return s;
}
const LEG_T = 16, LEG_OUT = 166, BEV = 1.6;
const legGeo = new THREE.ExtrudeGeometry(legProfile(), {
  depth: LEG_T, bevelEnabled: true, bevelThickness: BEV, bevelSize: BEV, bevelSegments: 3, curveSegments: 16
});

const stand = new THREE.Group(); stand.name = 'Stand';
device.add(stand);

const HUB_Z = zN - 14 * K, HUB_Y = 17.5 * K;
[-1, 1].forEach(side => {
  const leg = mesh(legGeo, shell, side < 0 ? 'Leg_Left' : 'Leg_Right');
  leg.rotation.y = -Math.PI / 2;           // profile x -> world z, extrude -> world -x
  leg.position.set(side > 0 ? LEG_OUT : -LEG_OUT + LEG_T, BEV, 0);
  stand.add(leg);

  const hub = mesh(new THREE.CylinderGeometry(14, 14, 4, 48), hubMat, 'PivotHub');
  hub.rotation.z = Math.PI / 2;
  hub.position.set(side * (LEG_OUT + BEV + 1.8), HUB_Y, HUB_Z);
  stand.add(hub);
  const cap = mesh(new THREE.CylinderGeometry(11, 11, 1.4, 48), shell, 'PivotCap');
  cap.rotation.z = Math.PI / 2;
  cap.position.set(side * (LEG_OUT + BEV + 4.2), HUB_Y, HUB_Z);
  stand.add(cap);
});

const span = 2 * (LEG_OUT - LEG_T) + 4;
const rear = mesh(new RoundedBoxGeometry(span, 7, 56, 3, 2.5), shell, 'RearPlate');
rear.position.set(0, BEV + 3.5, R.x + 40);
stand.add(rear);
const front = mesh(new RoundedBoxGeometry(span, 7, 26, 3, 2.5), shell, 'FrontBar');
front.position.set(0, BEV + 3.5, BF.x * 0.55);
stand.add(front);

scene.add(device);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const bob = reduced ? 0 : Math.sin(clock.getElapsedTime() * 1.2) * 0.25;
  device.position.y = bob * 28;
  const k = 1 - bob * 0.35; shadow.scale.set(k, k, 1); shadowMat.opacity = 1 - bob * 0.9;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
